steps:
  # Paso 1: Construir la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/rp-quickburn-ai-dev/quickburn-ai:$COMMIT_SHA', '.']

  # Paso 2: Subir la imagen a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/rp-quickburn-ai-dev/quickburn-ai:$COMMIT_SHA']

  # Paso 3: Desplegar automáticamente a Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'quickburn-ai'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/rp-quickburn-ai-dev/quickburn-ai:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--update-env-vars'
      - 'TELEGRAM_MODE=webhook,NODE_ENV=production,GCP_PROJECT_ID=quickburnai,GCP_LOCATION=us-central1'
      - '--allow-unauthenticated'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/rp-quickburn-ai-dev/quickburn-ai:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
